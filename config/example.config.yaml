###############################################
## 🦎 KOMODO MCP SERVER - REFERENCE CONFIG 🦎 ##
###############################################

## This is the official reference configuration for the Komodo MCP Server.
## It documents every available config file field with its environment variable,
## default value, and description.
##
## All fields are optional. If omitted, the default value is used.
##
## Priority (highest wins):
##   process.env -> Config File -> .env file -> Defaults
##
## Supported formats: TOML, YAML, JSON
## Auto-discovery filenames: config.toml, config.yaml, config.yml, config.json
## Explicit path: MCP_CONFIG_FILE_PATH=/path/to/config.toml
##
## For environment variable reference, see config/.env.example
##
## You can convert this file to other formats here:
##   - TOML: https://it-tools.tech/yaml-to-toml
##   - JSON: https://it-tools.tech/yaml-to-json
##
## Note: Secrets (API keys, passwords) should be set via environment variables
## or .env file, not in the config file. The komodo section supports
## non-secret connection settings; credentials belong in the environment.


## ===========================================================================
## KOMODO
## ===========================================================================

## How the MCP server connects to Komodo Core.
##
## This is a single shared connection, used for:
##   - stdio mode (local, one user), and
##   - open HTTP mode (authentication turned off).
## When authentication is on (the default for http/https), each person signs in with their
## own Komodo account instead, and this shared connection is not used for them.
##
## Set via KOMODO_* environment variables or here (env wins). Keep secrets (keys, passwords)
## in the environment, not in a committed config file.

komodo:

  ## Komodo Core server URL.
  ## Examples:
  ##   - Local:  "https://localhost:9120" or "https://127.0.0.1:9120"
  ##   - Remote: "https://komodo.example.com:9120"
  ##   - Docker: "https://host.docker.internal:9120"
  ## Env: KOMODO_URL
  ## Required for API connectivity.
  url: "https://komodo.example.com:9120"

  ## API Key for key-based authentication (recommended over username/password).
  ## Obtain from your Komodo server configuration.
  ## Env: KOMODO_API_KEY
  ## Optional, no default.
  api_key: "api-key"

  ## API Secret for key-based authentication.
  ## Env: KOMODO_API_SECRET
  ## Optional, no default.
  api_secret: "api-secret"

  ## Pre-existing JWT token (e.g. from OIDC/OAuth browser login).
  ## Extract from browser: JSON.parse(localStorage.getItem("komodo-auth-tokens-v1")).tokens[0].jwt
  ## Note: JWTs expire (default 1 day). For persistent auth, prefer API key.
  ## Env: KOMODO_JWT_TOKEN
  ## Optional, no default.
  jwt_token: "jwt-token"

  ## Username for login authentication.
  ## Recommended: Use a dedicated user with limited permissions.
  ## Env: KOMODO_USERNAME
  ## Optional, no default.
  username: "mcp-user"

  ## Password for login authentication.
  ## Env: KOMODO_PASSWORD
  ## Optional, no default.
  password: "password"

  ## Note: Docker Secrets (*_FILE pattern) are only supported as env vars:
  ##   KOMODO_API_KEY_FILE=/run/secrets/komodo_api_key
  ##   KOMODO_API_SECRET_FILE=/run/secrets/komodo_api_secret
  ##   KOMODO_JWT_TOKEN_FILE=/run/secrets/komodo_jwt_token
  ##   KOMODO_USERNAME_FILE=/run/secrets/komodo_username
  ##   KOMODO_PASSWORD_FILE=/run/secrets/komodo_password
  ## Priority: env var > secret file > config file value

  ## Komodo API request timeout.
  ## Accepts a duration string ("30s", "1m") or milliseconds (number).
  ## Env: KOMODO_API_TIMEOUT_MS
  ## Default: "30s" (30000ms)
  api_timeout_ms: "30s"


## ===========================================================================
## TRANSPORT
## ===========================================================================

transport:

  ## Transport mode for the MCP server.
  ## - "stdio"  - Single-client CLI mode (stdin/stdout). For Claude Desktop, VS Code, etc.
  ## - "http"   - Multi-client HTTP mode. Standard for network deployments.
  ## - "https"  - Multi-client HTTPS mode with TLS termination.
  ## Env: MCP_TRANSPORT
  ## Default: "http"
  mode: "http"

  ## Port the HTTP/HTTPS server listens on.
  ## Env: MCP_PORT
  ## Default: 8000
  port: 8000

  ## Host/IP to bind the server to.
  ## Use "0.0.0.0" to accept connections from all interfaces (containers, remote).
  ## Use "127.0.0.1" to only accept local connections.
  ## Env: MCP_BIND_HOST
  ## Default: "127.0.0.1"
  host: "127.0.0.1"

  ## Public URL behind a reverse proxy/domain — drives OAuth redirects, the login + RFC 9728
  ## metadata URLs, and is trusted for DNS-rebinding. Default: derived from host+port.
  ## Env: MCP_BASE_URL
  # base_url: "https://mcp.example.com"

  ## Enable the legacy SSE transport (MCP protocol version 2024-11-05).
  ## Only needed for backwards compatibility with older MCP clients that
  ## don't support Streamable HTTP (protocol 2025-03-26).
  ## Env: MCP_LEGACY_SSE_ENABLED
  ## Default: false
  sse_enabled: false

  ## Prefer JSON responses over SSE streams for simple request-response.
  ## When enabled, non-streaming responses (tools/list, resources/list) return
  ## application/json instead of text/event-stream.
  ## Warning: JSON mode silently drops progress and logging notifications.
  ## Env: MCP_JSON_RESPONSE
  ## Default: false
  json_response: false

  ## Stateless HTTP mode — no session IDs; each request is independent (GET/DELETE return 405).
  ## For load-balanced or serverless deployments where sessions can't be pinned.
  ## Env: MCP_STATELESS
  ## Default: false
  stateless: false

  ## TLS configuration (required when mode = "https").
  ## Certificate files are read from the filesystem at server startup.
  tls:
  
    ## Path to the TLS certificate file (PEM format).
    ## Env: MCP_TLS_CERT_PATH
    ## Required when mode = "https"
    cert_path: "/certs/server.crt"
  
    ## Path to the TLS private key file (PEM format).
    ## Env: MCP_TLS_KEY_PATH
    ## Required when mode = "https"
    key_path: "/certs/server.key"
  
    ## Path to the CA certificate file (PEM format).
    ## Optional - use for custom CA chains or mutual TLS.
    ## Env: MCP_TLS_CA_PATH
    ## Optional, no default.
    ca_path: "/certs/ca.crt"


## ===========================================================================
## AUTHENTICATION
## ===========================================================================

## Authentication of clients to THIS MCP server (distinct from the komodo connection
## credentials). Applies only to http/https - stdio is local and never authenticated.

auth:

  ## Require clients to sign in (each user gets an isolated per-user Komodo session). When DISABLED
  ## on a network transport the server is READ-ONLY for anonymous callers. stdio is always local.
  ## Env: MCP_AUTH_ENABLED
  ## Default: true
  enabled: true

  ## Required OAuth scopes for the /mcp endpoint (advanced; gateway/token setups).
  ## Env: MCP_AUTH_REQUIRED_SCOPES
  ## Optional, no default.
  # required_scopes:
  #   - "mcp"

  ## External OAuth providers (auth.providers.<name>) for Google/GitHub/OIDC federation are
  ## reserved for upcoming work and NOT wired in yet. Today, enabling auth offers local
  ## Komodo username/password login automatically.


## ===========================================================================
## SECURITY
## ===========================================================================

security:

  ## Maximum requests allowed per rate limit window.
  ## Applies to the /mcp endpoint only (health/metrics are not rate-limited).
  ## Env: MCP_RATE_LIMIT_MAX
  ## Default: 1000
  rate_limit_max: 1000

  ## Rate limit window duration.
  ## Accepts human-readable durations (e.g. "15m", "1h") or milliseconds (number).
  ## Env: MCP_RATE_LIMIT_WINDOW_MS
  ## Default: "15m" (900000ms)
  rate_limit_window: "15m"

  ## Trust proxy setting for Express.
  ## Required when running behind a reverse proxy (nginx, Traefik, cloud load balancer)
  ## to correctly resolve client IPs from X-Forwarded-For headers.
  ## Values:
  ##   - Number (hop count): 1, 2
  ##   - Keyword: "loopback", "linklocal", "uniquelocal"
  ##   - IP/CIDR: "10.0.0.1", "172.16.0.0/12"
  ##   - Comma-separated: "loopback, 10.0.0.1"
  ## Env: MCP_TRUST_PROXY
  ## Optional, no default (trust proxy disabled).
  trust_proxy: "loopback"

  ## Maximum request body size for the JSON body parser.
  ## Accepts Express size strings (e.g. "500kb", "1mb", "2mb").
  ## Env: MCP_BODY_SIZE_LIMIT
  ## Default: "1mb"
  body_size_limit: "1mb"

  ## Allowed hosts for DNS rebinding protection.
  ## When set, requests with a Host header not in this list are rejected (403).
  ## Important for servers exposed to the network.
  ## Env: MCP_ALLOWED_HOSTS
  ## Optional, no default (all hosts allowed).
  # allowed_hosts:
  #   - "mcp.example.com"
  #   - "localhost"

  ## CORS allowed origins.
  ## When set, the CORS middleware is mounted globally and allows requests
  ## from the listed origins. When omitted, CORS is completely disabled
  ## (no Access-Control-* headers are sent).
  ## Use ["*"] to allow all origins (not recommended for production).
  ## Env: MCP_CORS_ORIGIN
  ## Optional, no default (CORS disabled).
  cors_origin:
    - "*"

  ## Allow credentials (cookies, Authorization headers) in CORS requests.
  ## Only effective when cors_origin is set.
  ## Cannot be used together with cors_origin = ["*"].
  ## Env: MCP_CORS_CREDENTIALS
  ## Default: false
  cors_credentials: false

  ## Enable HTTP Strict Transport Security (HSTS) header via Helmet.
  ## When true, sets Strict-Transport-Security: max-age=15552000; includeSubDomains
  ## (180 days). Only enable when the server is exclusively accessed over HTTPS.
  ## Env: MCP_HELMET_HSTS
  ## Default: false (typically managed by reverse proxy)
  helmet_hsts: false

  ## Content Security Policy (CSP) configuration via Helmet.
  ## - Omit: Helmet's default CSP applies (restrictive, suitable for API servers)
  ## - "false": Disable CSP entirely
  ## - Custom string: CSP directives separated by semicolons
  ##   Example: "default-src 'self'; script-src 'none'; style-src 'self'"
  ## Env: MCP_HELMET_CSP
  ## Optional, no default (Helmet default CSP).
  helmet_csp: "default-src 'self'"

  ## X-Frame-Options header value via Helmet.
  ## Controls whether the server responses can be embedded in frames/iframes.
  ## - "DENY": Never allow framing (most secure, recommended)
  ## - "SAMEORIGIN": Allow framing from the same origin
  ## - "false": Disable X-Frame-Options header entirely
  ## Env: MCP_HELMET_FRAME_OPTIONS
  ## Default: "DENY"
  helmet_frame_options: "DENY"


## ===========================================================================
## TOOLS
## ===========================================================================

## Limit which tools clients can use: to restrict what the assistant is allowed to do
## (e.g. read-only, or no terminal access) and to keep the tool list small (fewer tokens).
## These settings only REMOVE tools - they never add tools or bypass authentication.
## Categories: config, container, server, stack, deployment, build, repo, procedure, action,
## alerter, swarm, resource_sync, variable, update, terminal, user, docker, builder, tag, toml.

tools:

  ## Allow only these tool categories. Leave unset to allow all.
  ## Env: MCP_TOOLS_ALLOWED_CATEGORIES
  ## Optional, no default (all categories allowed).
  # allowed_categories:
  #   - "server"
  #   - "stack"
  #   - "deployment"

  ## Remove whole categories.
  ## Env: MCP_TOOLS_EXCLUDED_CATEGORIES
  ## Optional, no default.
  # excluded_categories:
  #   - "swarm"

  ## Remove individual tools by name.
  ## Env: MCP_TOOLS_EXCLUDED_TOOLS
  ## Optional, no default.
  # excluded_tools:
  #   - "komodo_exec"

  ## Ask for confirmation before a destructive tool runs (delete, destroy, prune, exec,
  ## and procedure/action/sync runs).
  ## Env: MCP_CONFIRM_DESTRUCTIVE
  ## Default: true
  confirm_destructive: true

  ## What to do when the client cannot show a confirmation prompt:
  ## - "deny":  refuse the action (safe default)
  ## - "allow": run it anyway, with a warning
  ## Env: MCP_CONFIRM_FALLBACK
  ## Default: "deny"
  confirm_fallback: "deny"

  ## How long to wait for a confirmation answer — duration ("30s"/"5m"/"1h") or ms.
  ## Env: MCP_CONFIRM_TIMEOUT_MS
  ## Default: "5m"
  confirm_timeout: "5m"


## ===========================================================================
## REDACTION
## ===========================================================================

## Best-effort secret redaction of tool output at the framework's central, fail-closed
## boundary (key-name + value-shape heuristics). Defence-in-depth, not a guarantee.
##
## This section is the EXTENSION layer: the framework's generic MCP_SCRUB_ENABLED /
## MCP_SCRUB_ADDITIONAL_KEYS / MCP_SCRUB_ALLOW_KEYS form the base, and the settings here
## override the switch and add to the key lists.
##
## Covers the sync-TOML export too, so komodo_toml_export_* is meant for reading and
## diffing rather than re-applying via ResourceSync. Komodo Core itself masks only
## variable values, and only for non-admins - switching this off means server passkeys
## and alerter webhook URLs leave the server in plaintext.

redaction:

  ## Master switch for secret redaction of tool results and offloaded resources.
  ## Env: MCP_SECRET_SCRUB_ENABLED
  ## Default: true
  enabled: true

  ## Extra key-name fragments to always redact (case-insensitive).
  ## Env: MCP_SECRET_SCRUB_KEYS
  ## Optional, no default.
  # keys:
  #   - "internal_token"

  ## Exact key names to NEVER redact by key-matching (case-insensitive), merged with the
  ## built-in allowlist (public_key, is_secret, ...).
  ## Env: MCP_SECRET_SCRUB_ALLOW_KEYS
  ## Optional, no default.
  # allow_keys:
  #   - "public_cert"


## ===========================================================================
## RESOURCES
## ===========================================================================

## Ephemeral resource registry - large tool outputs (logs, inspect) are offloaded to
## `ephemeral://...` resource links, fetched out-of-band via resources/read.

resources:

  ## TTL for info/inspect resources. Duration ("15m") or milliseconds.
  ## Env: MCP_RESOURCE_TTL_INFO
  ## Default: "15m"
  ttl_info: "15m"

  ## TTL for log resources. Duration ("2m") or milliseconds.
  ## Env: MCP_RESOURCE_TTL_LOGS
  ## Default: "2m"
  ttl_logs: "2m"

  ## Maximum ephemeral entries kept in memory (oldest evicted first).
  ## Env: MCP_RESOURCE_MAX_ENTRIES
  ## Default: 1000
  max_entries: 1000


## ===========================================================================
## SESSIONS
## ===========================================================================

session:

  ## Maximum total concurrent sessions across all transports.
  ## Once reached, new connections are rejected.
  ## Env: MCP_MAX_SESSIONS
  ## Default: 200
  max_sessions: 200

  ## Maximum concurrent Streamable HTTP sessions.
  ## Must be <= max_sessions.
  ## Env: MCP_MAX_STREAMABLE_HTTP_SESSIONS
  ## Default: 100
  max_streamable_http_sessions: 100

  ## Maximum concurrent SSE sessions (legacy transport).
  ## Must be <= max_sessions.
  ## Env: MCP_MAX_SSE_SESSIONS
  ## Default: 50
  max_sse_sessions: 50


## ===========================================================================
## LOGGING
## ===========================================================================

logging:

  ## Log level. Messages below this level are suppressed.
  ## Env: LOG_LEVEL
  ## Default: "info"
  ## Values: "error", "warn", "info", "debug", "trace"
  level: "info"

  ## Log output format.
  ## - "text": Human-readable format for development
  ## - "json": Structured JSON (ECS-compatible) for log aggregation
  ## Env: LOG_FORMAT
  ## Default: "text"
  format: "text"

  ## Include RFC 3339 timestamps in text log output.
  ## Has no effect in JSON mode (timestamps are always included).
  ## Env: LOG_TIMESTAMP
  ## Default: false
  timestamp: false

  ## Include component name (e.g. [server-runtime], [session-mgr]) in text log output.
  ## Useful for debugging which component generated a log line.
  ## Env: LOG_COMPONENT
  ## Default: false
  component: false

  ## Directory for log file output. When set, logs are written to files
  ## in addition to console output.
  ## Env: LOG_DIR
  ## Optional, no default (file logging disabled).
  # log_dir: "/var/log/komodo-mcp"

  ## Maximum size of a single log file before rotation.
  ## Accepts human-readable sizes ("10mb", "500kb", "1gb") or byte counts.
  ## Env: LOG_MAX_FILE_SIZE
  ## Default: "10mb"
  max_file_size: "10mb"

  ## Maximum number of rotated log files to keep.
  ## Older rotated files beyond this count are deleted.
  ## Env: LOG_MAX_FILES
  ## Default: 3
  max_files: 3

  ## Automatic log file retention in days.
  ## Files older than this are deleted during cleanup sweeps.
  ## Set to 0 to disable time-based retention.
  ## Env: LOG_RETENTION_DAYS
  ## Default: 0 (disabled)
  retention_days: 0

  ## Dedicated JSON-Lines audit-log file (always on; records who did what to which resource + outcome).
  ## Env: LOG_AUDIT_FILE
  ## Default: "<log dir or ./logs>/audit.log"
  # audit_file: "/var/log/komodo-mcp/audit.log"

  ## How much request/result detail the audit log records for each tool call (always
  ## secret-scrubbed). Lets you reconstruct what was requested and which resources were affected.
  ##   - "off":     outcome + affected resources only (no request args, no result body)
  ##   - "summary": request args + a result summary (recommended)
  ##   - "full":    also the result's structured content (larger logs)
  ## Env: LOG_AUDIT_TOOL_IO
  ## Default: "summary"
  audit_tool_io: "summary"


## ===========================================================================
## TELEMETRY
## ===========================================================================

## OpenTelemetry distributed tracing and metrics.
## When enabled, the server collects traces and metrics and exports
## them via OTLP, Prometheus, or console.

telemetry:

  ## Master toggle for all OpenTelemetry features.
  ## When false, no OTEL packages are loaded (zero overhead).
  ## Env: OTEL_ENABLED
  ## Default: false
  enabled: false

  ## OTEL service name. When not set, defaults to the server name
  ## ("komodo-mcp-server"). Override for deployment-specific naming.
  ## Env: OTEL_SERVICE_NAME
  ## Optional, defaults to server name.
  ## service_name: "komodo-mcp-server"

  ## OTLP exporter endpoint URL.
  ## Used by both trace and metric OTLP exporters.
  ## Examples:
  ##   - Jaeger:                  http://jaeger:4318
  ##   - Grafana Tempo:           http://tempo:4318
  ##   - OpenTelemetry Collector: http://otel-collector:4318
  ## Env: OTEL_EXPORTER_OTLP_ENDPOINT
  ## Optional, no default.
  # exporter_endpoint: "http://localhost:4318"

  ## Trace exporter selection.
  ## Values: "otlp", "console", "none"
  ## Env: OTEL_TRACES_EXPORTER
  ## Default: "none"
  traces_exporter: "none"

  ## Log exporter selection.
  ## The framework has its own logging system, so OTEL log export is
  ## disabled by default to prevent unwanted OTLP connections.
  ## Values: "otlp", "console", "none"
  ## Env: OTEL_LOGS_EXPORTER
  ## Default: "none"
  logs_exporter: "none"

  ## SDK diagnostic log level for debugging OTEL internals.
  ## Values: "none", "error", "warn", "info", "debug", "verbose", "all"
  ## Env: OTEL_LOG_LEVEL
  ## Optional, default: "none"
  log_level: "none"

  ## Periodic metric export interval in milliseconds.
  ## How often PeriodicExportingMetricReader pushes metrics.
  ## Env: OTEL_METRIC_EXPORT_INTERVAL
  ## Optional, no default (SDK default applies).
  metric_export_interval: 60000

  ## Metric exporters to activate (comma-separated string).
  ## - "otlp":        Push metrics to OTLP endpoint
  ## - "prometheus":   Scrape endpoint at /metrics
  ## - "console":     Log metrics to console (debugging)
  ## - "none":        Disable all metric export
  ## Env: OTEL_METRICS_EXPORTER
  ## Default: "prometheus"
  metrics_exporter: "prometheus"
